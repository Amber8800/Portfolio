order = 2
orbit = { radius = 0.98, focus_zoom = 1.04 }
name = "창업ON"
summary = "창업자를 위한 정책·세무 AI"
role = "챗봇 검색 · 사업계획서 작성 서비스 · AWS 인프라"
brief_contribution = "세무 챗봇의 반복 검색 개선 · 62턴 평가 평균 응답 시간 29.6% 단축"
contribution = """
LangGraph로 챗봇을 설계해 정책·공고·세금 질문을 분류하고, 세금 질문은 계산이 필요한지에 따라 처리 경로를 나눴습니다. 정책·법령 문서를 DB에 적재하고 특수문자를 정리한 뒤 임베딩을 pgvector에 저장했습니다. 의미 기반 검색(Dense)과 키워드 검색(BM25)의 순위를 RRF로 결합하고, Cohere Rerank로 근거 문서의 순서를 다시 정했습니다.

사업계획서 서비스에서는 사용자가 아이디어를 입력해 초안을 받고, 평가를 읽으며 수정한 뒤 PDF나 한글 파일(HWPX)로 내려받는 흐름을 구현했습니다.

백엔드·LLM·데이터 수집 환경의 Python 의존성은 uv로 관리하고 각 환경의 패키지 버전을 uv.lock에 고정했습니다. AWS VPC에서는 외부 요청을 받는 EC2와 내부 DB용 EC2를 분리하고, Docker Compose로 각 서버에서 실행할 서비스를 구성했습니다. DB의 S3 백업과 서비스 도메인 연결도 맡았습니다."""
problem = "청년·1인 창업자가 받을 수 있는 지원금이나 세금 감면 혜택을 알아보려면 여러 기관의 공고와 세법을 찾아 자신의 업종과 사업 조건에 맞는지 확인해야 합니다. 창업ON은 이 질문에 공고문과 법령을 근거로 답하는 챗봇에서 출발했습니다. 이후 창업자가 혜택을 찾은 뒤에도 실무를 이어갈 수 있도록, 공고 양식에 맞춰 사업계획서 초안을 작성하고 영수증을 바탕으로 경비처리 가능 여부를 확인하는 기능까지 담았습니다."
decision = """
세금 질문 하나에 여러 조항이 필요해, 근거가 충분한지 LLM이 판단하며 다음 문서를 찾는 멀티홉 검색을 구성했습니다. 이 판단을 CatBoost에 맡겨 봤지만 세금 법령 18턴 평가에서 통과율이 낮아지고 응답도 느려졌습니다. LLM 판정을 유지하면서 반복 작업을 줄였습니다. 검색 질의의 유사도가 0.92 이상이면 앞서 찾은 문서를 활용하고, 납세자 조건과 근거 문서까지 일치할 때 판정 결과를 재사용했습니다.

정책 검색에서는 상위 다섯 결과에 정답 정책이 하나라도 포함된 질문의 비율(Hit@5)을 확인했습니다. 개발용 63문항에서 Elasticsearch의 한국어 분석기 Nori를 튜닝하자 재정렬 후 Hit@5가 85.7%에서 90.5%로 올랐습니다. 문서를 추가한 뒤 새 정책 63문항으로 비교했을 때는 최종 답변의 인용 Hit@5가 두 방식 모두 88.9%(56/63)였습니다. 같은 조건에서 세금 대화 62턴의 처리 경로·응답 상태·근거 등을 자동 검사한 결과, 기본 BM25는 46턴(74.2%), Nori는 40턴(64.5%)을 통과했습니다. 정책 적중률이 같고 세금 평가에서 기본 BM25가 6턴 더 통과해, 운영 검색에는 Dense와 기본 BM25의 조합을 유지했습니다."""
result = """
세금 질문 31개 시나리오(62턴)에서 캐시를 미리 채워 평가한 결과, 평균 응답 시간은 17.69초에서 12.46초로 29.6% 줄었고 통과율은 77.4%(48/62)로 같았습니다. 반복 질문은 빨라졌지만 처음 접하는 질문에는 여전히 여러 번의 검색과 근거 판정이 필요했습니다.

돌아보면 검색기를 바꾸는 실험에 비해 문서를 어떻게 나눌지는 충분히 검증하지 못했습니다. 문서 길이와 조항 구조를 살피기 전에 청크를 1,000자, 겹치는 구간을 150자로 정했습니다. 다시 만든다면 조항 단위 분할과 고정 길이 분할을 먼저 비교하고, 법령명·조항 같은 메타데이터로 검색 범위를 좁혔을 때 멀티홉보다 적은 조회로 필요한 근거를 찾을 수 있는지 실험하고 싶습니다."""
