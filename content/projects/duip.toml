brief_contribution = "분류 모델 6종 비교 · 이탈자 재현율을 기준으로 XGBoost 선정"
problem = "정기후원 단체의 담당자는 후원을 중단할 가능성이 큰 사람이 누구인지, 그 사람에게 어떤 방식으로 연락할지 판단해야 합니다. 두잎은 아름다운재단 기부문화연구소의 기빙코리아 개인기부자 조사 데이터를 활용해 후원자별 이탈 위험을 예측하고, 담당자가 연락 채널과 메시지 초안까지 한 화면에서 검토할 수 있도록 만든 서비스입니다."
contribution = "팀 PM과 이탈 예측 모델 개발을 맡았습니다. Git 사용에 어려움을 겪는 팀원들을 위해 가이드를 작성해 공유했고, Jira로 일정을 관리해 팀이 예정일보다 일주일 일찍 프로젝트를 마치는 데 기여했습니다. 모델 개발에서는 기부자 설문 데이터를 전처리하고 로지스틱 회귀, 랜덤 포레스트, XGBoost, CatBoost, 신경망 등 여섯 모델을 학습했습니다. 실험 결과를 한눈에 비교할 수 있는 모델 히스토리 화면도 구현했습니다."
decision = "설문은 응답자를 올해 기부한 사람, 작년에 기부했지만 올해는 기부하지 않은 사람, 기부 경험이 없는 사람으로 구분했습니다. 이 중 작년에 기부했다가 올해 중단한 응답자를 ‘이탈자’로 정의하고, 이탈 여부를 사실상 알려 주는 항목은 학습 입력에서 제외했습니다. 모델 선택 기준은 재현율, 즉 실제 이탈자 중 모델이 찾아낸 비율이었습니다. 무작위 탐색(Random Search)으로 튜닝한 XGBoost는 정확도 1위는 아니었지만 이탈자 재현율이 가장 높아 최종 모델로 선택했습니다."
result = "다른 연도의 설문까지 항목을 맞춰 합쳤지만 예측 성능은 크게 개선되지 않았고, 기대한 만큼 이탈자를 찾아내지 못했습니다. 이 경험을 통해 설문 연도를 늘리는 것 외에 어떤 데이터가 이탈 징후를 더 잘 보여 줄지 검토할 필요를 느꼈습니다. 다시 만든다면 설문 외 데이터의 효과를 검증하고, 배포 후에도 모델 성능을 추적하고 재학습할 수 있도록 처음부터 MLOps를 고려해 설계하고 싶습니다."
