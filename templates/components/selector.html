{% from "components/planet-system.html" import foreground_courses, planet_system %}
  <form id="project-orbits" class="orbit-map" aria-labelledby="selector-title" data-orbit>
    <div class="route-field" aria-hidden="true">{% include "components/routes.svg" %}</div>
    <span class="system-star" aria-hidden="true">{{ foreground_courses() }}</span>
    {% for p in projects %}
    <button class="planet-choice" type="submit"
            formaction="{{ root }}projects/{{ p.slug }}/" formmethod="get"
            data-project="{{ p.slug }}" data-camera-distance="{{ p.camera_distance }}"
            aria-pressed="{{ 'true' if loop.first else 'false' }}"
            aria-controls="project-briefing" aria-label="{{ p.name }}, {{ p.summary }}"
            style="--base:{{ p.angle }}deg;--radius:{{ p.orbit.radius }};--initial-x:{{ p.x }}%;--initial-y:{{ p.y }}%;--initial-scale:{{ p.scale }}">
      {{ planet_system(p, root) }}
      <span class="planet-label"><strong>{{ p.name }}</strong><small>{{ p.summary }}</small></span>
    </button>
    {% endfor %}
  </form>
  <noscript>
    <style>.orbit-map, .project-index { display: none }</style>
    <nav class="static-projects" aria-label="프로젝트 상세">
      {% for p in projects %}<a href="{{ root }}projects/{{ p.slug }}/">{{ p.name }}</a>{% endfor %}
    </nav>
  </noscript>
