<svg class="routes" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true" focusable="false" fill="none">
  <defs>
    <linearGradient id="course-light" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#82c6db" stop-opacity=".66"/>
      <stop offset=".55" stop-color="#a2e5f4" stop-opacity=".90"/>
      <stop offset="1" stop-color="#d1f8fc"/>
    </linearGradient>
  </defs>
  <g id="projected-courses" transform="matrix({{ orbit.rx }} {{ orbit.tilt_y }} {{ orbit.front_x }} {{ orbit.ry }} {{ orbit.cx }} {{ orbit.cy }})">
    {% for p in projects %}
    <g class="orbit-track{% if loop.first %} is-current{% endif %}" data-course="{{ p.slug }}"
       style="--radius:{{ p.orbit.radius }}" transform="matrix({{ p.ellipse[0] }} 0 0 {{ p.ellipse[1] }} 0 {{ p.ellipse[2] }})">
      <circle r="1" stroke="#58c8f5" stroke-opacity=".08" vector-effect="non-scaling-stroke" stroke-width="9"/>
      <circle r="1" stroke="#70d4ee" stroke-opacity=".25" vector-effect="non-scaling-stroke" stroke-width="3.7"/>
      <circle class="flight-course" r="1" stroke="url(#course-light)" vector-effect="non-scaling-stroke" stroke-width="1.2"/>
    </g>
    {% endfor %}
  </g>
</svg>
