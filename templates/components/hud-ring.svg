{% macro ring_half(side) -%}
{% set track = 'M 7,50 A 113,27 0 0 1 233,50' %}
<svg class="selection-ring ring-{{ side }}" viewBox="0 0 240 100" aria-hidden="true" focusable="false" fill="none">
  <g{% if side == 'front' %} transform="rotate(180 120 50)"{% endif %}>
    <path class="ring-track" pathLength="180" d="{{ track }}"/>
    <path class="ring-rail" pathLength="180" d="M 16,50 A 104,23 0 0 1 224,50"/>
    <path class="ring-ticks" pathLength="180" d="M 4,50 A 116,30 0 0 1 236,50"/>
    <path class="ring-scan" pathLength="180" d="{{ track }}"/>
    <path class="ring-marker" pathLength="180" d="{{ track }}"/>
  </g>
</svg>
{%- endmacro %}
